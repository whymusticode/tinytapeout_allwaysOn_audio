# Candidate wake words for the detectability sweep.
#
# Each candidate is trained with the same model budget and scored on
# false rejects at a fixed false-accept rate (per hour) over long background streams.
# Synthetic positives come from Piper TTS (many speakers and speeds), mixed into
# noise/music/speech backgrounds and room reverb.
#
# Groups:
#   control_real  Speech Commands words: real speakers. Calibrates synthetic-only training against reality.
#   control_bad   Expected to be poor (common words). Sanity check that the ranking makes sense.
#   linux         Open-source themed phrases.
#   prefixed      "hey/okay X" with an uncommon X.
#   word          Single long, uncommon real words.
#   invented      Made-up words built from distinctive phonemes (plosives, fricatives, varied vowels).
#   phrase        Longer phrases (more evidence, but more effort to say).
#
# Avoided: other companies' wake words and brand names.

candidates:
