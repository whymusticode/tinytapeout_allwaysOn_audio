# Tiny Tapeout project information
project:
  title:        "Open always-on wake-word detector"      # Project title
  author:       "Michael Benton"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "PDM mic front end + VAD, growing into an open always-on keyword spotter"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     16384000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # 16 tiles (search_space.budget). Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_whymusticode_wakeword"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pdm_cic.v"
    - "vad.v"
    - "audio_ring.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PDM_DATA"
  ui[1]: "PDM_EDGE"
  ui[2]: "STREAM_REQ"
  ui[3]: "SPI_CS_N (reserved)"
  ui[4]: "SPI_MOSI (reserved)"
  ui[5]: "VAD_THR[0]"
  ui[6]: "VAD_THR[1]"
  ui[7]: "VAD_THR[2]"

  # Outputs
  uo[0]: "WAKE_IRQ (reserved)"
  uo[1]: "PDM_CLK"
  uo[2]: "AUDIO_TX"
  uo[3]: "VAD"
  uo[4]: "STREAMING"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "QSPI_CS0 flash"
  uio[1]: "QSPI_SD0 MOSI"
  uio[2]: "QSPI_SD1 MISO"
  uio[3]: "QSPI_SCK"
  uio[4]: "QSPI_SD2"
  uio[5]: "QSPI_SD3"
  uio[6]: "QSPI_CS1 RAM A (audio buffer)"
  uio[7]: "QSPI_CS2 RAM B"

# Do not change!
yaml_version: 6
